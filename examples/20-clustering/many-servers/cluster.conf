# peer discovery: nodes find each other from this fixed list
cluster_formation.peer_discovery_backend = classic_config

# node name = rabbit@<server hostname>; every name must resolve on every server (/etc/hosts or DNS)
cluster_formation.classic_config.nodes.1 = rabbit@server1
cluster_formation.classic_config.nodes.2 = rabbit@server2
cluster_formation.classic_config.nodes.3 = rabbit@server3

# network split (partition) between servers: the side with fewer nodes (minority) pauses itself,
# so only the majority side (2 of 3) keeps accepting messages -> no two "different" clusters
cluster_partition_handling = pause_minority
